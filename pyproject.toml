[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "andes-risk-ai"
version = "0.1.0"
description = "Reproducible, experimental landslide-risk research workflows for Bolivia"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Wilson Rene Chura Quispe"}]
dependencies = []

[project.scripts]
andes-risk = "andes_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
